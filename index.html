<html lang="en" class="dark">
<head>

  <meta name="theme-color" content="#050816" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AuraWealth — Personal Finance Manager</title>

  <!-- Google Fonts: Inter ONLY (weights 400-800) for uniform optical baselines -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            obsidian: '#050816',
            midnight: '#0b1126',
          }
        }
      }
    };
  </script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- Custom Dark Glassmorphism, Typography & Baseline Alignment Styles -->
  <style>
    :root {
      --bg-base: #050816;
      --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.025) 100%);
      --glass-border: rgba(255, 255, 255, 0.11);
      --glass-highlight: rgba(255, 255, 255, 0.16);
    }

    *, *::before, *::after {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--bg-base);
      color: #f1f5f9;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* Strict tabular & lining numbers for pixel-perfect vertical alignment */
    .tabular-nums {
      font-variant-numeric: tabular-nums lining-nums;
      font-feature-settings: "tnum" 1, "lnum" 1;
    }

    /* Animated Ambient Background Orbs */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background:
        radial-gradient(circle at 14% 12%, rgba(79, 70, 229, 0.22), transparent 44%),
        radial-gradient(circle at 86% 24%, rgba(6, 182, 212, 0.17), transparent 42%),
        radial-gradient(circle at 50% 90%, rgba(168, 85, 247, 0.15), transparent 50%),
        linear-gradient(180deg, #050816 0%, #090e24 52%, #050712 100%);
    }

    .glow-orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(85px);
      opacity: 0.42;
      will-change: transform;
    }

    .orb-1 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #6366f1 0%, transparent 70%);
      top: -90px;
      left: -80px;
      animation: floatOrb1 16s ease-in-out infinite alternate;
    }

    .orb-2 {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
      top: 28%;
      right: -90px;
      animation: floatOrb2 20s ease-in-out infinite alternate;
    }

    .orb-3 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #a855f7 0%, transparent 70%);
      bottom: -80px;
      left: 20%;
      animation: floatOrb3 18s ease-in-out infinite alternate;
    }

    @keyframes floatOrb1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(55px, 40px) scale(1.14); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-50px, 60px) scale(1.1); }
    }
    @keyframes floatOrb3 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -45px) scale(1.16); }
    }

    /* Core Glassmorphism Surfaces */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      border: 1px solid var(--glass-border);
      box-shadow:
        0 18px 40px -14px rgba(0, 0, 0, 0.58),
        inset 0 1px 0 0 var(--glass-highlight);
      transition: transform 0.18s ease, border-color 0.2s ease, background-color 0.2s ease;
    }

    .glass-card-interactive:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .glass-hero {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(99, 102, 241, 0.28) 0%, rgba(168, 85, 247, 0.16) 46%, rgba(6, 182, 212, 0.22) 100%),
        rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.17);
      box-shadow:
        0 24px 60px -15px rgba(30, 27, 75, 0.72),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.28);
    }

    .glass-hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -30%;
      width: 160%;
      height: 120%;
      background: radial-gradient(ellipse at 30% 20%, rgba(255, 255, 255, 0.12), transparent 55%);
      pointer-events: none;
    }

    .glass-header {
      background: rgba(7, 11, 28, 0.78);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
    }

    .glass-dock {
      background: rgba(9, 14, 34, 0.86);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-top: 1px solid rgba(255, 255, 255, 0.11);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.55);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .glass-modal {
      background: linear-gradient(160deg, rgba(16, 24, 50, 0.96) 0%, rgba(8, 12, 28, 0.98) 100%);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.8),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    /* Uniform Form Controls (h-12, zero overlap on mobile Chrome/Brave) */
    .glass-input {
      background-color: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.13);
      color: #f8fafc;
      transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .glass-input:focus {
      outline: none;
      background-color: rgba(15, 23, 42, 0.92);
      border-color: rgba(99, 102, 241, 0.8);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.22);
    }

    .glass-input::placeholder {
      color: #64748b;
    }

    .glass-input option {
      background-color: #0f172a;
      color: #f8fafc;
    }

    input[type="date"] {
      color-scheme: dark;
      -webkit-appearance: none;
      appearance: none;
      line-height: normal;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.85);
      cursor: pointer;
      opacity: 0.85;
    }

    /* Glossy Gradient & Subtle Buttons */
    .btn-glossy {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 52%, #06b6d4 100%);
      box-shadow:
        0 10px 26px -6px rgba(99, 102, 241, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: transform 0.16s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn-glossy:hover {
      filter: brightness(1.08);
    }

    .btn-glossy:active {
      transform: scale(0.96);
    }

    .btn-subtle {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.15s ease;
    }

    .btn-subtle:hover {
      background: rgba(255, 255, 255, 0.11);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-subtle:active {
      transform: scale(0.97);
    }

    /* Animations */
    .fade-slide-in {
      animation: fadeSlideIn 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-pop {
      animation: modalPop 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes modalPop {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .toast-enter {
      animation: toastIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-16px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 9999px; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="antialiased selection:bg-indigo-500/40 selection:text-white">

      // --- STORAGE PERSISTENCE ---
      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.transactions) && parsed.settings) {
              parsed.settings = {
                ...getDefaultSettings(),
                ...parsed.settings,
                categoryBudgets: {
                  ...getDefaultSettings().categoryBudgets,
                  ...(parsed.settings.categoryBudgets || {})
                }
              };
              return parsed;
            }
          }
        } catch (err) {
          console.warn('localStorage load failed:', err);
        }
        const seeded = createDemoDataset();
        saveData(seeded);
        return seeded;
      }

      function saveData(dataObj = appData) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(dataObj));
        } catch (err) {
          console.warn('localStorage save failed:', err);
          showToast('Unable to save locally (private mode or full storage).', 'warning');
        }
      }

      // --- FORMATTING & ESCAPING ---
      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function getCurrencyInfo() {
        return CURRENCIES[appData.settings.currency] || CURRENCIES.INR;
      }

      function formatCurrency(amount, showSign = false) {
        const cur = getCurrencyInfo();
        const num = Number(amount) || 0;
        const absVal = Math.abs(num);
        const isWhole = Math.abs(absVal - Math.round(absVal)) < 0.005;
        const maxDec = cur.decimals === 0 ? 0 : (isWhole ? 0 : 2);

        const formatted = absVal.toLocaleString(cur.locale, {
          minimumFractionDigits: maxDec,
          maximumFractionDigits: maxDec
        });

        if (num < 0) return `-${cur.symbol}${formatted}`;
        if (showSign && num > 0) return `+${cur.symbol}${formatted}`;
        return `${cur.symbol}${formatted}`;
      }

      function formatCompactCurrency(amount) {
        const cur = getCurrencyInfo();
        const num = Number(amount) || 0;
        const sign = num < 0 ? '-' : '';
        const abs = Math.abs(num);

        if (cur.code === 'INR') {
          if (abs >= 10000000) return `${sign}${cur.symbol}${(abs / 10000000).toFixed(1)}Cr`;
          if (abs >= 100000) return `${sign}${cur.symbol}${(abs / 100000).toFixed(1)}L`;
          if (abs >= 1000) return `${sign}${cur.symbol}${(abs / 1000).toFixed(abs >= 10000 ? 0 : 1)}k`;
        } else {
          if (abs >= 1000000) return `${sign}${cur.symbol}${(abs / 1000000).toFixed(1)}M`;
          if (abs >= 1000) return `${sign}${cur.symbol}${(abs / 1000).toFixed(abs >= 10000 ? 0 : 1)}k`;
        }
        return `${sign}${cur.symbol}${Math.round(abs)}`;
      }

      function parseYearMonth(isoDate) {
        const parts = (isoDate || '').split('-');
        return {
          year: Number(parts[0]) || 0,
          month: (Number(parts[1]) || 1) - 1,
          day: Number(parts[2]) || 1
        };
      }

      // Concise date for inline transaction metadata (e.g., "Nov 21" or "Nov 21, 2025")
      function formatShortRowDate(isoDate) {
        const { year, month, day } = parseYearMonth(isoDate);
        if (month < 0 || month > 11) return isoDate;
        const showYear = year !== today.getFullYear();
        return showYear ? `${MONTH_SHORT[month]} ${day}, ${year}` : `${MONTH_SHORT[month]} ${day}`;
      }

      // Group header date (e.g., "Today · Nov 22, 2026")
      function formatGroupDate(isoDate) {
        const { year, month, day } = parseYearMonth(isoDate);
        if (month < 0 || month > 11) return isoDate;
        const now = new Date();
        const isToday = year === now.getFullYear() && month === now.getMonth() && day === now.getDate();
        const yest = new Date(now);
        yest.setDate(now.getDate() - 1);
        const isYesterday = year === yest.getFullYear() && month === yest.getMonth() && day === yest.getDate();
        const base = `${MONTH_SHORT[month]} ${day}, ${year}`;
        if (isToday) return `Today · ${base}`;
        if (isYesterday) return `Yesterday · ${base}`;
        return base;
      }

      // --- FINANCIAL CALCULATION ENGINE ---
      function getMonthTransactions(year, month) {
        const prefix = `${year}-${pad2(month + 1)}-`;
        return appData.transactions
          .filter(t => t.date && t.date.startsWith(prefix))
          .sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
      }

      function getYearTransactions(year) {
        const prefix = `${year}-`;
        return appData.transactions
          .filter(t => t.date && t.date.startsWith(prefix))
          .sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
      }

      function getAllAvailableYears() {
        const years = new Set([today.getFullYear(), uiState.selectedYear]);
        appData.transactions.forEach(t => {
          const y = parseYearMonth(t.date).year;
          if (y >= 1970 && y <= 2100) years.add(y);
        });
        return Array.from(years).sort((a, b) => b - a);
      }

      function computeMonthMetrics(year, month) {
        const monthStart = `${year}-${pad2(month + 1)}-01`;
        const monthEnd = `${year}-${pad2(month + 1)}-31`;
        const yearStart = `${year}-01-01`;

        let priorBalance = 0;
        let monthIncome = 0;
        let monthExpense = 0;
        let salaryIncome = 0;
        let otherIncome = 0;
        let ytdSavings = 0;
        let allTimeSavings = 0;

        const categoryExpenses = {};
        const incomeBySource = {};

        for (const t of appData.transactions) {
          const amt = Number(t.amount) || 0;
          const signed = t.type === 'income' ? amt : -amt;
          allTimeSavings += signed;

          if (t.date < monthStart) {
            priorBalance += signed;
          }
          if (t.date >= yearStart && t.date <= monthEnd) {
            ytdSavings += signed;
          }
          if (t.date >= monthStart && t.date <= monthEnd) {
            if (t.type === 'income') {
              monthIncome += amt;
              if (t.category === 'Salary') salaryIncome += amt;
              else otherIncome += amt;
              incomeBySource[t.category] = (incomeBySource[t.category] || 0) + amt;
            } else {
              monthExpense += amt;
              categoryExpenses[t.category] = (categoryExpenses[t.category] || 0) + amt;
            }
          }
        }

        const remainingBalance = monthIncome - monthExpense;
        const cumulativeNetWorth = priorBalance + remainingBalance;
        const savingsRate = monthIncome > 0
          ? (remainingBalance / monthIncome) * 100
          : (monthExpense > 0 ? -100 : 0);

        // Budget Alerts
        const alerts = [];
        const overallBudget = Number(appData.settings.overallBudget) || 0;
        if (overallBudget > 0) {
          const pct = (monthExpense / overallBudget) * 100;
          if (pct >= 100) {
            alerts.push({ level: 'danger', scope: 'Overall Monthly Budget', spent: monthExpense, limit: overallBudget, pct });
          } else if (pct >= 80) {
            alerts.push({ level: 'warning', scope: 'Overall Monthly Budget', spent: monthExpense, limit: overallBudget, pct });
          }
        }

        const catBudgets = appData.settings.categoryBudgets || {};
        Object.keys(EXPENSE_CATEGORIES).forEach(cat => {
          const limit = Number(catBudgets[cat]) || 0;
          const spent = categoryExpenses[cat] || 0;
          if (limit > 0 && spent > 0) {
            const pct = (spent / limit) * 100;
            if (pct >= 100) alerts.push({ level: 'danger', scope: cat, spent, limit, pct });
            else if (pct >= 80) alerts.push({ level: 'warning', scope: cat, spent, limit, pct });
          }
        });

        alerts.sort((a, b) => {
          if (a.level !== b.level) return a.level === 'danger' ? -1 : 1;
          return b.pct - a.pct;
        });

        const breakdown = Object.keys(categoryExpenses)
          .map(cat => {
            const spent = categoryExpenses[cat];
            const limit = Number(catBudgets[cat]) || 0;
            return {
              category: cat,
              spent,
              sharePct: monthExpense > 0 ? (spent / monthExpense) * 100 : 0,
              budgetLimit: limit,
              budgetPct: limit > 0 ? (spent / limit) * 100 : 0
            };
          })
          .sort((a, b) => b.spent - a.spent);

        const incomeSourcesList = Object.entries(incomeBySource)
          .map(([source, amount]) => ({
            source,
            amount,
            sharePct: monthIncome > 0 ? (amount / monthIncome) * 100 : 0
          }))
          .sort((a, b) => b.amount - a.amount);

        return {
          monthIncome,
          monthExpense,
          remainingBalance,
          savingsRate,
          priorBalance,
          cumulativeNetWorth,
          ytdSavings,
          allTimeSavings,
          salaryIncome,
          otherIncome,
          incomeSourcesList,
          categoryExpenses,
          breakdown,
          alerts
        };
      }

      function computeYearlySummary(year) {
        const yearStart = `${year}-01-01`;
        const yearEnd = `${year}-12-31`;

        let openingBalance = 0;
        let annualIncome = 0;
        let annualExpense = 0;

        const months = Array.from({ length: 12 }, (_, idx) => ({
          monthIndex: idx,
          label: MONTH_SHORT[idx],
          fullLabel: MONTH_NAMES[idx],
          income: 0,
          expense: 0,
          savings: 0,
          savingsRate: 0,
          txCount: 0,
          runningBalance: 0
        }));

        for (const t of appData.transactions) {
          const amt = Number(t.amount) || 0;
          const signed = t.type === 'income' ? amt : -amt;
          if (t.date < yearStart) {
            openingBalance += signed;
          } else if (t.date >= yearStart && t.date <= yearEnd) {
            const { month } = parseYearMonth(t.date);
            if (month >= 0 && month < 12) {
              months[month].txCount += 1;
              if (t.type === 'income') {
                months[month].income += amt;
                annualIncome += amt;
              } else {
                months[month].expense += amt;
                annualExpense += amt;
              }
            }
          }
        }

        let running = openingBalance;
        months.forEach(m => {
          m.savings = m.income - m.expense;
          m.savingsRate = m.income > 0 ? (m.savings / m.income) * 100 : (m.expense > 0 ? -100 : 0);
          running += m.savings;
          m.runningBalance = running;
        });

        const annualNetSavings = annualIncome - annualExpense;
        const closingBalance = openingBalance + annualNetSavings;
        const annualSavingsRate = annualIncome > 0
          ? (annualNetSavings / annualIncome) * 100
          : (annualExpense > 0 ? -100 : 0);

        return {
          year,
          openingBalance,
          annualIncome,
          annualExpense,
          annualNetSavings,
          annualSavingsRate,
          closingBalance,
          months
        };
      }

      // --- TOAST NOTIFICATIONS ---
      function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        if (!container) return;

        const styles = {
          success: { border: 'border-emerald-400/40', iconBg: 'bg-emerald-500/20 text-emerald-300', icon: 'check' },
          warning: { border: 'border-amber-400/40',   iconBg: 'bg-amber-500/20 text-amber-300',     icon: 'alert' },
          error:   { border: 'border-rose-400/40',    iconBg: 'bg-rose-500/20 text-rose-300',       icon: 'alert' },
          info:    { border: 'border-cyan-400/40',    iconBg: 'bg-cyan-500/20 text-cyan-300',       icon: 'sparkles' }
        };
        const st = styles[type] || styles.info;

        const toast = document.createElement('div');
        toast.className = `toast-enter pointer-events-auto glass-modal ${st.border} rounded-2xl px-4 py-3 flex items-center gap-3 shadow-2xl w-full`;
        toast.innerHTML = `
          <span class="w-7 h-7 rounded-xl ${st.iconBg} flex items-center justify-center shrink-0">
            ${getIconSvg(st.icon, 'w-4 h-4 shrink-0')}
          </span>
          <p class="text-[13px] font-medium text-slate-100 leading-snug flex-1 min-w-0">${escapeHtml(message)}</p>
        `;

        container.appendChild(toast);
        setTimeout(() => {
          toast.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(-10px)';
          setTimeout(() => toast.remove(), 260);
        }, 3000);
      }

      // --- CLIPBOARD HELPER (MOBILE & IFRAME SAFE) ---
      function copyTextToClipboard(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.left = '-9999px';
        ta.setAttribute('readonly', '');
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        let ok = false;
        try {
          ok = document.execCommand('copy');
        } catch (e) {
          ok = false;
        }
        document.body.removeChild(ta);
        return ok;
      }

      function validateAndImportJson(rawText) {
        try {
          const parsed = JSON.parse(rawText);
          if (!parsed || !Array.isArray(parsed.transactions)) {
            showToast('Invalid backup format: missing transactions array.', 'error');
            return;
          }

          const cleanedTx = [];
          for (const item of parsed.transactions) {
            if (!item || (item.type !== 'income' && item.type !== 'expense')) continue;
            const amt = Number(item.amount);
            if (!amt || amt <= 0) continue;
            if (!item.date || !/^\d{4}-\d{2}-\d{2}$/.test(item.date)) continue;
            cleanedTx.push({
              id: String(item.id || generateId()),
              type: item.type,
              amount: Math.round(amt * 100) / 100,
              date: item.date,
              category: String(item.category || (item.type === 'income' ? 'Other Income' : 'Other')),
              description: String(item.description || item.category || '')
            });
          }

          const mergedSettings = {
            ...getDefaultSettings(),
            ...(parsed.settings || {}),
            categoryBudgets: {
              ...getDefaultSettings().categoryBudgets,
              ...((parsed.settings && parsed.settings.categoryBudgets) || {})
            }
          };

          if (!CURRENCIES[mergedSettings.currency]) {
            mergedSettings.currency = 'INR';
          }

          openConfirmModal({
            title: 'Restore Backup Data?',
            message: `Found ${cleanedTx.length} valid transactions. Restoring will replace your current local records with this backup.`,
            confirmText: 'Restore Now',
            danger: false,
            onConfirm: () => {
              appData = {
                version: 1,
                transactions: cleanedTx,
                settings: mergedSettings
              };
              saveData();
              showToast(`Restored ${cleanedTx.length} transactions successfully!`, 'success');
              renderApp();
            }
          });
        } catch (err) {
          showToast('Could not parse JSON. Please check your backup file.', 'error');
        }
      }

      function confirmDeleteTransaction(txId) {
        const tx = appData.transactions.find(t => t.id === txId);
        if (!tx) return;
        openConfirmModal({
          title: 'Delete Transaction?',
          message: `Remove "${tx.description}" (${formatCurrency(tx.amount)}) from ${formatGroupDate(tx.date)}? Monthly and yearly balances will recalculate automatically.`,
          confirmText: 'Delete',
          danger: true,
          onConfirm: () => {
            appData.transactions = appData.transactions.filter(t => t.id !== txId);
            saveData();
            showToast('Transaction deleted.', 'info');
            renderApp();
          }
        });
      }

      // --- EXPORT HELPERS ---
      function downloadFile(content, filename, mimeType) {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function exportBackupJson() {
        const payload = JSON.stringify(appData, null, 2);
        const dateStamp = formatDateISO(today.getFullYear(), today.getMonth(), today.getDate());
        downloadFile(payload, `aurawealth-backup-${dateStamp}.json`, 'application/json');
        showToast('Full JSON backup downloaded!', 'success');
      }

      function exportTransactionsCsv() {
        const rows = [['Date', 'Type', 'Category', 'Description', 'Amount', 'Currency']];
        const curCode = appData.settings.currency || 'INR';
        const sorted = [...appData.transactions].sort((a, b) => b.date.localeCompare(a.date));
        sorted.forEach(t => {
          const safeDesc = '"' + String(t.description || '').replace(/"/g, '""') + '"';
          rows.push([t.date, t.type, t.category, safeDesc, t.amount, curCode]);
        });
        const csv = rows.map(r => r.join(',')).join('\n');
        const dateStamp = formatDateISO(today.getFullYear(), today.getMonth(), today.getDate());
        downloadFile(csv, `aurawealth-transactions-${dateStamp}.csv`, 'text/csv;charset=utf-8;');
        showToast(`Exported ${sorted.length} transactions to CSV!`, 'success');
      }

      // =========================================================================
      // VIEW 2: TRANSACTIONS TAB
      // =========================================================================
      function renderTransactionsTab() {
        const f = uiState.txFilters;
        let list = [];

        if (f.period === 'month') {
          list = getMonthTransactions(uiState.selectedYear, uiState.selectedMonth);
        } else if (f.period === 'year') {
          list = getYearTransactions(uiState.selectedYear);
        } else {
          list = [...appData.transactions].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
        }

        if (f.type !== 'all') list = list.filter(t => t.type === f.type);
        if (f.category !== 'all') list = list.filter(t => t.category === f.category);

        const q = f.search.trim().toLowerCase();
        if (q) {
          list = list.filter(t =>
            (t.description || '').toLowerCase().includes(q) ||
            (t.category || '').toLowerCase().includes(q)
          );
        }

        let totalIn = 0;
        let totalOut = 0;
        list.forEach(t => {
          if (t.type === 'income') totalIn += Number(t.amount) || 0;
          else totalOut += Number(t.amount) || 0;
        });
        const net = totalIn - totalOut;

        const grouped = new Map();
        list.forEach(t => {
          if (!grouped.has(t.date)) grouped.set(t.date, []);
          grouped.get(t.date).push(t);
        });

        const catOptions = f.type === 'income'
          ? Object.keys(INCOME_CATEGORIES)
          : f.type === 'expense'
            ? Object.keys(EXPENSE_CATEGORIES)
            : [...Object.keys(EXPENSE_CATEGORIES), ...Object.keys(INCOME_CATEGORIES)];

        let groupedHtml = '';
        if (grouped.size > 0) {
          grouped.forEach((items, dateKey) => {
            const dayNet = items.reduce((acc, item) => acc + (item.type === 'income' ? item.amount : -item.amount), 0);
            groupedHtml += `
              <div class="glass-card rounded-3xl overflow-hidden">
                <div class="flex items-center justify-between gap-2 px-4 py-2.5 bg-white/[0.025] border-b border-white/[0.06]">
                  <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 leading-none truncate">${formatGroupDate(dateKey)}</span>
                  <span class="text-xs font-bold tabular-nums whitespace-nowrap shrink-0 leading-none ${dayNet >= 0 ? 'text-emerald-400' : 'text-slate-300'}">
                    ${dayNet >= 0 ? '+' : ''}${formatCurrency(dayNet)}
                  </span>
                </div>
                <div class="divide-y divide-white/[0.06]">
                  ${items.map(tx => renderTransactionRow(tx, true)).join('')}
                </div>
              </div>
            `;
          });
        } else {
          groupedHtml = `
            <div class="glass-card rounded-3xl p-10 text-center">
              <div class="w-12 h-12 rounded-2xl bg-white/[0.05] text-slate-400 flex items-center justify-center mx-auto mb-3">
                ${getIconSvg('search', 'w-5 h-5 shrink-0')}
              </div>
              <p class="text-sm font-semibold text-slate-200">No matching transactions found</p>
              <p class="text-xs text-slate-400 mt-1">Try adjusting your search or filter criteria.</p>
              ${(f.search || f.type !== 'all' || f.category !== 'all') ? `
                <button type="button" id="tx-clear-filters-btn" class="mt-4 h-10 px-4 rounded-xl btn-subtle text-xs font-semibold text-indigo-300 leading-none">Reset Filters</button>
              ` : ''}
            </div>
          `;
        }

        return `
          <div class="space-y-4 fade-slide-in">
            <!-- Search & Filters Card -->
            <section class="glass-card rounded-3xl p-4 sm:p-5 space-y-3.5">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="min-w-0">
                  <h2 class="font-bold text-lg text-white leading-snug">Transactions</h2>
                  <p class="text-xs text-slate-400 leading-none mt-1 tabular-nums">${list.length} record${list.length === 1 ? '' : 's'} · Tap any row to edit</p>
                </div>

                <!-- Timeframe Toggle -->
                <div class="flex items-center p-1 rounded-xl bg-white/[0.05] border border-white/10 text-xs font-semibold shrink-0">
                  <button type="button" data-tx-period="month" class="tx-period-btn h-8 px-2.5 rounded-lg leading-none whitespace-nowrap transition ${f.period === 'month' ? 'bg-indigo-500 text-white shadow' : 'text-slate-400 hover:text-white'}">
                    ${MONTH_SHORT[uiState.selectedMonth]}
                  </button>
                  <button type="button" data-tx-period="year" class="tx-period-btn h-8 px-2.5 rounded-lg leading-none whitespace-nowrap tabular-nums transition ${f.period === 'year' ? 'bg-indigo-500 text-white shadow' : 'text-slate-400 hover:text-white'}">
                    ${uiState.selectedYear}
                  </button>
                  <button type="button" data-tx-period="all" class="tx-period-btn h-8 px-2.5 rounded-lg leading-none whitespace-nowrap transition ${f.period === 'all' ? 'bg-indigo-500 text-white shadow' : 'text-slate-400 hover:text-white'}">
                    All Time
                  </button>
                </div>
              </div>

              <!-- Search Input (Uniform h-12 with aligned search icon & clear button) -->
              <div class="relative">
                <span class="absolute left-3.5 inset-y-0 flex items-center text-slate-400 pointer-events-none">
                  ${getIconSvg('search', 'w-4 h-4 shrink-0')}
                </span>
                <input id="tx-search-input" type="text" placeholder="Search description or category..." value="${escapeHtml(f.search)}"
                  class="w-full h-12 glass-input rounded-2xl pl-10 pr-10 text-sm" />
                ${f.search ? `
                  <button type="button" id="tx-search-clear" aria-label="Clear search" class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-xl flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition">
                    ${getIconSvg('x', 'w-4 h-4 shrink-0')}
                  </button>
                ` : ''}
              </div>

              <!-- Type Filter Pills + Category Select -->
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
                <div class="grid grid-cols-3 gap-1.5 sm:flex sm:items-center">
                  ${[
                    { key: 'all', label: 'All' },
                    { key: 'expense', label: 'Expenses' },
                    { key: 'income', label: 'Income' }
                  ].map(tp => `
                    <button type="button" data-tx-type="${tp.key}" class="tx-type-pill h-10 px-3.5 rounded-xl text-xs font-semibold leading-none whitespace-nowrap transition ${f.type === tp.key ? 'bg-white/15 text-white border border-indigo-400/60' : 'bg-white/[0.05] text-slate-400 border border-white/10 hover:text-white'}">
                      ${tp.label}
                    </button>
                  `).join('')}
                </div>

                <select id="tx-cat-select" aria-label="Filter by category" class="h-10 sm:h-10 glass-input rounded-xl px-3 text-xs font-semibold min-w-[160px]">
                  <option value="all" ${f.category === 'all' ? 'selected' : ''}>All Categories</option>
                  ${catOptions.map(c => `<option value="${escapeHtml(c)}" ${f.category === c ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
                </select>
              </div>
            </section>

            <!-- Filtered Summary Strip -->
            <section class="grid grid-cols-3 gap-2.5">
              <div class="glass-card rounded-2xl p-3 text-center min-w-0">
                <p class="text-[11px] font-medium text-emerald-300 leading-none">Inflow</p>
                <p class="text-[14px] sm:text-[15px] font-bold text-white tabular-nums leading-tight mt-1.5 truncate">${formatCurrency(totalIn)}</p>
              </div>
              <div class="glass-card rounded-2xl p-3 text-center min-w-0">
                <p class="text-[11px] font-medium text-rose-300 leading-none">Outflow</p>
                <p class="text-[14px] sm:text-[15px] font-bold text-white tabular-nums leading-tight mt-1.5 truncate">${formatCurrency(totalOut)}</p>
              </div>
              <div class="glass-card rounded-2xl p-3 text-center min-w-0">
                <p class="text-[11px] font-medium text-cyan-300 leading-none">Net</p>
                <p class="text-[14px] sm:text-[15px] font-bold tabular-nums leading-tight mt-1.5 truncate ${net < 0 ? 'text-rose-300' : 'text-emerald-400'}">${formatCurrency(net, true)}</p>
              </div>
            </section>

            <!-- Date-Grouped Transaction Cards -->
            <section class="space-y-3">
              ${groupedHtml}
            </section>
          </div>
        `;
      }

      // =========================================================================
      // VIEW 3: ANALYTICS & YEARLY ARCHIVE TAB
      // =========================================================================
      function renderAnalyticsTab() {
        const year = uiState.selectedYear;
        const month = uiState.selectedMonth;
        const m = computeMonthMetrics(year, month);

        const prevMonthDate = new Date(year, month - 1, 1);
        const prevMetrics = computeMonthMetrics(prevMonthDate.getFullYear(), prevMonthDate.getMonth());
        const momDiff = m.monthExpense - prevMetrics.monthExpense;
        const momPct = prevMetrics.monthExpense > 0
          ? (momDiff / prevMetrics.monthExpense) * 100
          : (m.monthExpense > 0 ? 100 : 0);

        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const isCurrentMonth = year === today.getFullYear() && month === today.getMonth();
        const elapsedDays = isCurrentMonth ? Math.max(1, today.getDate()) : daysInMonth;
        const dailyAvg = m.monthExpense / elapsedDays;
        const topCategory = m.breakdown.length > 0 ? m.breakdown[0] : null;

        const availableYears = getAllAvailableYears();
        if (!availableYears.includes(uiState.archiveYear)) {
          uiState.archiveYear = availableYears[0];
        }
        const yearly = computeYearlySummary(uiState.archiveYear);

        return `
          <div class="space-y-4 fade-slide-in">
            <!-- Month-over-Month Spending Comparison Card -->
            <section class="glass-card rounded-3xl p-4 sm:p-5">
              <div class="flex items-center justify-between gap-2 mb-4">
                <div class="min-w-0">
                  <h2 class="font-bold text-lg text-white leading-snug">Spending Analytics</h2>
                  <p class="text-xs text-slate-400 leading-none mt-1">${MONTH_NAMES[month]} ${year} Overview</p>
                </div>
                <span class="px-3 py-1.5 rounded-xl text-xs font-bold leading-none tabular-nums whitespace-nowrap shrink-0 inline-flex items-center gap-1 ${momDiff <= 0 ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'}">
                  ${getIconSvg(momDiff <= 0 ? 'trendingDown' : 'trending', 'w-3.5 h-3.5 shrink-0')}
                  <span>${Math.abs(momPct).toFixed(1)}% vs ${MONTH_SHORT[prevMonthDate.getMonth()]}</span>
                </span>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                <div class="rounded-2xl bg-white/[0.04] border border-white/10 p-3.5 min-w-0">
                  <p class="text-[11px] text-slate-400 font-medium leading-none">vs ${MONTH_SHORT[prevMonthDate.getMonth()]} ${prevMonthDate.getFullYear()}</p>
                  <p class="text-[16px] font-bold tabular-nums leading-tight mt-2 truncate ${momDiff <= 0 ? 'text-emerald-400' : 'text-rose-300'}">
                    ${momDiff > 0 ? '+' : ''}${formatCurrency(momDiff)}
                  </p>
                  <p class="text-[11px] text-slate-400 mt-1 leading-none tabular-nums">Prev: ${formatCurrency(prevMetrics.monthExpense)}</p>
                </div>

                <div class="rounded-2xl bg-white/[0.04] border border-white/10 p-3.5 min-w-0">
                  <p class="text-[11px] text-slate-400 font-medium leading-none">Daily Avg Spend</p>
                  <p class="text-[16px] font-bold text-white tabular-nums leading-tight mt-2 truncate">${formatCurrency(dailyAvg)}</p>
                  <p class="text-[11px] text-slate-400 mt-1 leading-none tabular-nums">Across ${elapsedDays} day${elapsedDays === 1 ? '' : 's'}</p>
                </div>

                <div class="rounded-2xl bg-white/[0.04] border border-white/10 p-3.5 min-w-0">
                  <p class="text-[11px] text-slate-400 font-medium leading-none">Top Category</p>
                  <p class="text-[16px] font-bold text-indigo-300 truncate leading-tight mt-2">${topCategory ? escapeHtml(topCategory.category) : 'None'}</p>
                  <p class="text-[11px] text-slate-400 mt-1 leading-none tabular-nums">
                    ${topCategory ? `${formatCurrency(topCategory.spent)} · ${topCategory.sharePct.toFixed(0)}%` : 'No expenses yet'}
                  </p>
                </div>
              </div>
            </section>

            <!-- CHART 1: Category Breakdown Doughnut -->

              <div class="flex items-center justify-between gap-2 mb-4">

                  <p class="text-xs text-slate-400 leading-none mt-1">${MONTH_NAMES[month]} ${year}</p>
                </div>
                <span class="text-[14px] font-bold text-white tabular-nums whitespace-nowrap shrink-0 leading-none">${formatCurrency(m.monthExpense)}</span>
              </div>

              ${m.breakdown.length > 0 ? `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-center">
                  <div class="relative h-56 w-full flex items-center justify-center">
                    <canvas id="chart-category-doughnut"></canvas>
                  </div>
                  <div class="divide-y divide-white/[0.06] max-h-60 overflow-y-auto pr-1">
                    ${m.breakdown.map(item => {
                      const meta = getCategoryMeta('expense', item.category);
                      return `
                        <div class="flex items-center justify-between gap-3 py-2.5 first:pt-0 last:pb-0 text-xs">
                          <div class="flex items-center gap-2.5 min-w-0 flex-1">
                            <span class="w-3 h-3 rounded-full shrink-0" style="background:${meta.color}"></span>
                            <span class="font-medium text-slate-200 truncate leading-none">${escapeHtml(meta.label)}</span>

                </div>
                <div class="flex items-center gap-3 text-[11px] font-semibold leading-none shrink-0">
                  <span class="inline-flex items-center gap-1.5 text-emerald-300"><span class="w-2.5 h-2.5 rounded-sm bg-emerald-400 shrink-0"></span>Income</span>
                  <span class="inline-flex items-center gap-1.5 text-rose-300"><span class="w-2.5 h-2.5 rounded-sm bg-rose-400 shrink-0"></span>Expenses</span>
                </div>
              </div>
              <div class="relative h-60 sm:h-64 w-full">

                <div class="flex items-center gap-2.5 min-w-0">
                  <span class="w-9 h-9 rounded-xl bg-cyan-500/15 text-cyan-300 flex items-center justify-center shrink-0">
                    ${getIconSvg('calendar', 'w-5 h-5 shrink-0')}

                    <button type="button" data-archive-year="${y}" class="archive-year-btn h-8 px-3.5 rounded-xl text-xs font-bold tabular-nums leading-none transition ${y === uiState.archiveYear ? 'btn-glossy text-white' : 'bg-white/[0.06] border border-white/10 text-slate-300 hover:bg-white/10'}">
                      ${y}
                    </button>
                  `).join('')}
                </div>
              </div>

              <!-- 6 Yearly Summary Metrics -->
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 mb-4">
                <div class="rounded-2xl bg-white/[0.04] border border-white/10 p-3 min-w-0">
                  <p class="text-[11px] text-slate-400 leading-none truncate">Opening Carried In</p>

                </div>
                <div class="rounded-2xl bg-emerald-500/10 border border-emerald-500/20 p-3 min-w-0">
                  <p class="text-[11px] text-emerald-200/80 leading-none truncate">${yearly.year} Income</p>

      function initAnalyticsCharts() {
        if (typeof Chart === 'undefined') return;
        destroyCharts();

        const year = uiState.selectedYear;
        const month = uiState.selectedMonth;
        const m = computeMonthMetrics(year, month);
        const ySummary = computeYearlySummary(year);

        Chart.defaults.color = '#94a3b8';
        Chart.defaults.font.family = "'Inter', system-ui, -apple-system, sans-serif";
        Chart.defaults.font.size = 11;

        const tooltipStyle = {
          backgroundColor: 'rgba(10, 15, 34, 0.96)',
          borderColor: 'rgba(255, 255, 255, 0.15)',
          borderWidth: 1,
          padding: 10,
          cornerRadius: 12,
          titleFont: { family: "'Inter', sans-serif", weight: '600', size: 12 },
          bodyFont: { family: "'Inter', sans-serif", weight: '500', size: 12 }
        };

        // 1. Category Expense Doughnut
        const doughnutEl = document.getElementById('chart-category-doughnut');
        if (doughnutEl && m.breakdown.length > 0) {
          chartInstances.doughnut = new Chart(doughnutEl, {
            type: 'doughnut',
            data: {
              labels: m.breakdown.map(b => b.category),
              datasets: [{
                data: m.breakdown.map(b => b.spent),
                backgroundColor: m.breakdown.map(b => getCategoryMeta('expense', b.category).color),
                borderColor: 'rgba(9, 14, 34, 0.92)',
                borderWidth: 2.5,
                hoverOffset: 7
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: '66%',
              plugins: {
                legend: { display: false },
                tooltip: {
                  ...tooltipStyle,
                  callbacks: {
                    label: (ctx) => ` ${ctx.label}: ${formatCurrency(ctx.parsed)} (${((ctx.parsed / (m.monthExpense || 1)) * 100).toFixed(1)}%)`
                  }
                }
              }
            }
          });
        }

        // 2. Income vs Expenses Grouped Bar
        const barEl = document.getElementById('chart-income-expense');
        if (barEl) {
          chartInstances.bar = new Chart(barEl, {
            type: 'bar',
            data: {
              labels: MONTH_SHORT,
              datasets: [
                {
                  label: 'Income',
                  data: ySummary.months.map(x => x.income),
                  backgroundColor: 'rgba(52, 211, 153, 0.84)',
                  hoverBackgroundColor: '#34d399',
                  borderRadius: 6,
                  borderSkipped: false
                },
                {
                  label: 'Expenses',
                  data: ySummary.months.map(x => x.expense),
                  backgroundColor: 'rgba(251, 113, 133, 0.84)',
                  hoverBackgroundColor: '#fb7185',
                  borderRadius: 6,
                  borderSkipped: false
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              interaction: { mode: 'index', intersect: false },
              plugins: {
                legend: { display: false },
                tooltip: {
                  ...tooltipStyle,
                  callbacks: {
                    label: (ctx) => ` ${ctx.dataset.label}: ${formatCurrency(ctx.parsed.y)}`
                  }
                }
              },
              scales: {
                x: { grid: { display: false } },
                y: {
                  beginAtZero: true,
                  grid: { color: 'rgba(255, 255, 255, 0.06)' },
                  ticks: { callback: (val) => formatCompactCurrency(val) }
                }
              }
            }
          });
        }

        // 3. Monthly Savings Trend Area Line
        const lineEl = document.getElementById('chart-savings-trend');
        if (lineEl) {
          const ctx2d = lineEl.getContext('2d');
          const grad = ctx2d.createLinearGradient(0, 0, 0, 220);
          grad.addColorStop(0, 'rgba(56, 189, 248, 0.4)');
          grad.addColorStop(1, 'rgba(99, 102, 241, 0.01)');

          chartInstances.line = new Chart(lineEl, {
            type: 'line',
            data: {
              labels: MONTH_SHORT,
              datasets: [{
                label: 'Net Savings',
                data: ySummary.months.map(x => x.savings),
                borderColor: '#38bdf8',
                backgroundColor: grad,
                borderWidth: 2.5,
                tension: 0.36,
                fill: true,
                pointBackgroundColor: '#0f172a',
                pointBorderColor: '#38bdf8',
                pointBorderWidth: 2,
                pointRadius: 3.5,
                pointHoverRadius: 6
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              interaction: { mode: 'index', intersect: false },
              plugins: {
                legend: { display: false },
                tooltip: {
                  ...tooltipStyle,
                  callbacks: {
                    label: (ctx) => ` Net Savings: ${formatCurrency(ctx.parsed.y, true)}`
                  }
                }
              },
              scales: {
                x: { grid: { display: false } },
                y: {
                  grid: { color: 'rgba(255, 255, 255, 0.06)' },
                  ticks: { callback: (val) => formatCompactCurrency(val) }
                }
              }
            }
          });
        }
      }

      // =========================================================================
      // MASTER RENDERER & EVENT BINDING
      // =========================================================================
      function updateHeaderAndNav() {
        const cur = getCurrencyInfo();
        document.getElementById('header-currency-label').textContent = `${cur.code} (${cur.symbol})`;
        document.getElementById('active-period-label').textContent = `${MONTH_SHORT[uiState.selectedMonth]} ${uiState.selectedYear}`;

        document.querySelectorAll('.nav-tab-btn').forEach(btn => {
          const tab = btn.getAttribute('data-tab');
          if (tab === uiState.activeTab) {
            btn.classList.add('text-indigo-300');
            btn.classList.remove('text-slate-400');
          } else {
            btn.classList.remove('text-indigo-300');
            btn.classList.add('text-slate-400');
          }
        });
      }

      function bindTransactionRowClicks() {
        document.querySelectorAll('.tx-row-btn').forEach(row => {
          row.onclick = () => {
            const id = row.getAttribute('data-open-tx');
            const tx = appData.transactions.find(t => t.id === id);
            if (tx) openTransactionModal({ mode: 'edit', tx });
          };
        });
      }

      function renderApp() {
        updateHeaderAndNav();
        destroyCharts();

        const container = document.getElementById('app-content');

        if (uiState.activeTab === 'dashboard') {
          container.innerHTML = renderDashboard();
          bindTransactionRowClicks();

          document.getElementById('qa-add-expense').onclick = () => openTransactionModal({ defaultType: 'expense' });
          document.getElementById('qa-add-income').onclick = () => openTransactionModal({ defaultType: 'income' });
          document.getElementById('qa-quick-salary').onclick = openQuickSalaryModal;
          document.getElementById('dash-edit-salary-btn').onclick = openQuickSalaryModal;

          const manageBudgetsBtn = document.getElementById('dash-manage-budgets');
          if (manageBudgetsBtn) manageBudgetsBtn.onclick = () => switchTab('settings');

          document.getElementById('dash-view-charts-btn').onclick = () => switchTab('analytics');
          document.getElementById('dash-view-all-tx').onclick = () => {
            uiState.txFilters = { search: '', type: 'all', category: 'all', period: 'month' };
            switchTab('transactions');
          };

          document.querySelectorAll('.dash-cat-row').forEach(btn => {
            btn.onclick = () => {
              const cat = btn.getAttribute('data-jump-cat');
              uiState.txFilters = { search: '', type: 'expense', category: cat, period: 'month' };
              switchTab('transactions');
            };
          });
        }
        else if (uiState.activeTab === 'transactions') {
          container.innerHTML = renderTransactionsTab();
          bindTransactionRowClicks();

          const searchInput = document.getElementById('tx-search-input');
          searchInput.oninput = (e) => {
            const pos = e.target.selectionStart;
            uiState.txFilters.search = e.target.value;
            renderApp();
            const restored = document.getElementById('tx-search-input');
            if (restored) {
              restored.focus();
              restored.setSelectionRange(pos, pos);
            }
          };

          const searchClear = document.getElementById('tx-search-clear');
          if (searchClear) {
            searchClear.onclick = () => {
              uiState.txFilters.search = '';
              renderApp();
            };
          }

          document.querySelectorAll('.tx-period-btn').forEach(btn => {
            btn.onclick = () => {
              uiState.txFilters.period = btn.getAttribute('data-tx-period');
              renderApp();
            };
          });

          document.querySelectorAll('.tx-type-pill').forEach(btn => {
            btn.onclick = () => {
              uiState.txFilters.type = btn.getAttribute('data-tx-type');
              uiState.txFilters.category = 'all';
              renderApp();
            };
          });

          document.getElementById('tx-cat-select').onchange = (e) => {
            uiState.txFilters.category = e.target.value;
            renderApp();
          };

          const clearBtn = document.getElementById('tx-clear-filters-btn');
          if (clearBtn) {
            clearBtn.onclick = () => {
              uiState.txFilters = { search: '', type: 'all', category: 'all', period: uiState.txFilters.period };
              renderApp();
            };
          }
        }
        else if (uiState.activeTab === 'analytics') {
          container.innerHTML = renderAnalyticsTab();
          requestAnimationFrame(() => initAnalyticsCharts());

          document.querySelectorAll('.archive-year-btn').forEach(btn => {
            btn.onclick = () => {
              uiState.archiveYear = Number(btn.getAttribute('data-archive-year'));
              renderApp();
            };
          });

          document.getElementById('toggle-archive-table').onclick = () => {
            uiState.archiveTableExpanded = !uiState.archiveTableExpanded;
            renderApp();
          };

          document.querySelectorAll('.archive-month-row').forEach(row => {
            row.onclick = () => {
              const [yStr, mStr] = row.getAttribute('data-jump-ym').split('-');
              uiState.selectedYear = Number(yStr);
              uiState.selectedMonth = Number(mStr);
              switchTab('dashboard');
              showToast(`Switched to ${MONTH_NAMES[uiState.selectedMonth]} ${uiState.selectedYear}`, 'info');
            };
          });
        }
        else if (uiState.activeTab === 'settings') {
          container.innerHTML = renderSettingsTab();

          document.querySelectorAll('.currency-pick-btn').forEach(btn => {
            btn.onclick = () => {
              const code = btn.getAttribute('data-set-currency');
              if (CURRENCIES[code]) {
                appData.settings.currency = code;
                saveData();
                showToast(`Currency updated to ${CURRENCIES[code].name} (${CURRENCIES[code].symbol})`, 'success');
                renderApp();
              }
            };
          });

          document.getElementById('save-general-settings').onclick = () => {
            const sal = Math.max(0, parseFloat(document.getElementById('set-default-salary').value) || 0);
            const goal = Math.max(0, parseFloat(document.getElementById('set-savings-goal').value) || 0);
            appData.settings.defaultMonthlySalary = sal;
            appData.settings.savingsGoal = goal;
            saveData();
            showToast('Salary & savings goal saved!', 'success');
            renderApp();
          };

          document.getElementById('set-apply-salary-month').onclick = () => {
            const salVal = Math.max(0, parseFloat(document.getElementById('set-default-salary').value) || 0);
            if (salVal > 0) {
              appData.settings.defaultMonthlySalary = salVal;
              saveData();
            }
            openQuickSalaryModal();
          };

          document.getElementById('save-budgets-btn').onclick = () => {
            const overall = Math.max(0, parseFloat(document.getElementById('set-overall-budget').value) || 0);
            appData.settings.overallBudget = overall;
            const newCatBudgets = {};
            document.querySelectorAll('.cat-budget-input').forEach(inp => {
              const key = inp.getAttribute('data-cat-budget');
              newCatBudgets[key] = Math.max(0, parseFloat(inp.value) || 0);
            });
            appData.settings.categoryBudgets = newCatBudgets;
            saveData();
            showToast('Monthly budget limits updated!', 'success');
            renderApp();
          };

          document.getElementById('btn-export-json').onclick = exportBackupJson;
          document.getElementById('btn-export-csv').onclick = exportTransactionsCsv;

          document.getElementById('btn-copy-json').onclick = () => {
            const ok = copyTextToClipboard(JSON.stringify(appData, null, 2));
            if (ok) showToast('Backup JSON copied to clipboard!', 'success');
            else showToast('Could not copy automatically. Use Download (.json).', 'warning');
          };

          document.getElementById('btn-import-json').onclick = () => {
            const fileInput = document.getElementById('json-file-input');
            fileInput.value = '';
            fileInput.click();
          };

          document.getElementById('btn-paste-json').onclick = openPasteJsonModal;

          document.getElementById('btn-load-demo').onclick = () => {
            openConfirmModal({
              title: 'Load Demo Data?',
              message: 'This replaces your current local records with realistic 2025 & 2026 sample transactions, budgets, and savings history.',
              confirmText: 'Load Demo',
              danger: false,
              onConfirm: () => {
                appData = createDemoDataset();
                saveData();
                uiState.selectedYear = today.getFullYear();
                uiState.selectedMonth = today.getMonth();
                uiState.archiveYear = today.getFullYear();
                showToast('Multi-year demo data loaded!', 'success');
                switchTab('dashboard');
              }
            });
          };

          document.getElementById('btn-clear-all').onclick = () => {
            openConfirmModal({
              title: 'Start Fresh & Clear All Data?',
              message: 'This permanently deletes all transactions across all years. Consider exporting a JSON backup first.',
              confirmText: 'Clear Everything',
              danger: true,
              onConfirm: () => {
                appData = {
                  version: 1,
                  transactions: [],
                  settings: {
                    ...getDefaultSettings(),
                    currency: appData.settings.currency,
                    defaultMonthlySalary: 0,
                    overallBudget: 0,
                    savingsGoal: 0,
                    categoryBudgets: Object.fromEntries(Object.keys(EXPENSE_CATEGORIES).map(k => [k, 0]))
                  }
                };
                saveData();
                uiState.selectedYear = today.getFullYear();
                uiState.selectedMonth = today.getMonth();
                uiState.archiveYear = today.getFullYear();
                showToast('All records cleared. Ready for a fresh start!', 'info');
                switchTab('dashboard');
              }
            });
          };
        }
      }

      function switchTab(tabName) {
        uiState.activeTab = tabName;
        renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // --- GLOBAL NAVIGATION & EVENT LISTENERS ---
      function initEventListeners() {
        document.querySelectorAll('.nav-tab-btn').forEach(btn => {
          btn.onclick = () => switchTab(btn.getAttribute('data-tab'));
        });

        document.getElementById('fab-quick-add').onclick = () => openTransactionModal({ defaultType: 'expense' });
        document.getElementById('header-currency-btn').onclick = () => switchTab('settings');

        document.getElementById('prev-month-btn').onclick = () => {
          uiState.selectedMonth--;
          if (uiState.selectedMonth < 0) {
            uiState.selectedMonth = 11;
            uiState.selectedYear--;
          }
          uiState.archiveYear = uiState.selectedYear;
          renderApp();
        };

        document.getElementById('next-month-btn').onclick = () => {
          uiState.selectedMonth++;
          if (uiState.selectedMonth > 11) {
            uiState.selectedMonth = 0;
            uiState.selectedYear++;
          }
          uiState.archiveYear = uiState.selectedYear;
          renderApp();
        };

        document.getElementById('open-date-picker-btn').onclick = openMonthYearPickerModal;

        document.getElementById('json-file-input').addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => validateAndImportJson(String(ev.target.result || ''));
          reader.onerror = () => showToast('Failed to read the selected file.', 'error');
          reader.readAsText(file);
        });

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') closeModal();
        });
      }

      // --- BOOTSTRAP ---
      window.addEventListener('DOMContentLoaded', () => {
        appData = loadData();
        initEventListeners();
        renderApp();
      });
    })();
  </script>
</body>
</html>
