name: Build AuraWealth Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare web app & Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.aurawealth.app",
            "appName": "AuraWealth",
            "webDir": "www",
            "android": {
              "backgroundColor": "#070b14",
              "adjustMarginsForEdgeToEdge": "force",
              "allowMixedContent": true
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Match Android status bar to dark theme
        run: |
          COLORS_FILE="android/app/src/main/res/values/colors.xml"
          if [ -f "$COLORS_FILE" ]; then
            sed -i 's/\(name="colorPrimary[^"]*"[^>]*>\)[^<]*/\1#070b14/g' "$COLORS_FILE"
          fi

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../AuraWealth.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraWealth-APK
          path: AuraWealth.apk

      - name: Publish direct APK download to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest AuraWealth.apk --clobber
          else
            gh release create latest AuraWealth.apk \
              --title "AuraWealth Android App" \
              --notes "Tap **AuraWealth.apk** below to download and install on Android."
          fi
